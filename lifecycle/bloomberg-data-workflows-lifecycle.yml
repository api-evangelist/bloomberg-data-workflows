description: >-
  Versioning and lifecycle posture for the Bloomberg data-workflow APIs, read from the surfaces
  Bloomberg publishes anonymously. The SDK is versioned publicly and released often; the HTTP
  contract is not versioned in public at all.
versioning:
  scheme: sdk-semver
  current: 3.26.7.1
  docs: https://bloomberg.github.io/blpapi-docs/
  note: >-
    BLPAPI SDK builds carry a four-part version (3.26.7.1) and each minor gets its own published
    reference set at bloomberg.github.io/blpapi-docs/<language>/<major.minor.patch>/. The Data
    License REST API is served under a single unversioned path prefix (/eap/) with no version
    segment, no Accept-version header documented, and no public version history.
  api_path_versioning: false
deprecation:
