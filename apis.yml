apis:
- aid: bloomberg-data-workflows:bloomberg-data-license-api
  name: Bloomberg Data License API
  description: Batch and per-security delivery of Bloomberg's reference, pricing, regulatory and alternative data
    for integration into proprietary applications and workflows. The REST / hypermedia entry point is https://api.bloomberg.com/eap/;
    every request must carry a signed JWT (RFC 7519) issued against the customer's Data License credential file.
    The same content is also delivered over SFTP and natively into the major cloud providers.
  humanURL: https://professional.bloomberg.com/products/data/data-license/
  baseURL: https://api.bloomberg.com/eap
  tags:
  - Financial Data
  - Market Data
  - Pricing
  - Reference Data
  properties:
  - type: Documentation
    url: https://professional.bloomberg.com/support/api-library/
