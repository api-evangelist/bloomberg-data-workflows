aid: bloomberg-data-workflows
name: Bloomberg Data Workflows
description: 'Bloomberg Data Workflows covers the programmatic paths institutional clients use to move Bloomberg''s
  financial data into their own systems: the Data License API, which delivers reference, pricing, regulatory and
  alternative data in bulk or per security over a JWT-authenticated REST/hypermedia endpoint at api.bloomberg.com/eap,
  over SFTP, or natively into the major cloud providers; and the Server API (SAPI), the shared-server deployment
  of BLPAPI that serves real-time subscription and historical request/response market data to applications across
  a firm. Both are gated behind an active Bloomberg Professional or Enterprise agreement. Bloomberg ships first-party
  BLPAPI SDKs for C++, Java, C# (.NET) and Python from its own distribution hosts, but publishes no OpenAPI, AsyncAPI,
  GraphQL schema or MCP server for either API, and keeps the API reference behind the DATA <GO> customer portal.'
