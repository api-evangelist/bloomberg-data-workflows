- aid: bloomberg-data-workflows:bloomberg-server-api
  name: Bloomberg SAPI (Server API)
  description: 'The shared-server deployment of BLPAPI, providing real-time subscription and historical request/response
    market data to applications across a firm. SAPI is not an HTTP API: clients open a TCP session with the BLPAPI
    SDK against the customer''s own Server API host (the Desktop API equivalent is localhost:8194), so no public
    base URL exists. Identity is the firm''s Bloomberg entitlements, not a token.'
  humanURL: https://professional.bloomberg.com/products/data/data-connectivity/server-api/
