description: >-
  Bloomberg publishes no price, no tier and no quota for any data-workflow API. The Data License
  product page names two commercial shapes — Data License Per Security and Data License Bulk, plus
  the managed Data License Plus (DL+) service — but attaches no price, no included volume and no
  overage rate to any of them. Every route ends at "Request a Demo" or a regional support phone
  number. Access requires a Bloomberg Professional or Enterprise agreement, priced per contract.
