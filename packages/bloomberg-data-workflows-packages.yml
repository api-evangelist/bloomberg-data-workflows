description: >-
  First-party Bloomberg client libraries for the data-workflow APIs. Every artifact below is the
  BLPAPI SDK — the single client library Bloomberg ships for the Desktop API, the Server API
  (SAPI), B-PIPE and the Bloomberg Platform. Bloomberg does NOT publish BLPAPI to any public
  community registry: there is no `blpapi` on PyPI (404), none on npm, none on Maven Central
  (g:com.bloomberglp returns 0 documents) and none on nuget.org (404). Distribution is from
  Bloomberg's own hosts — a PEP 503 simple index and a NuGet v3 feed on blpapi.bloomberg.com,
  plus versioned archives linked from the API Library page. Versions and dates below were read
  from those first-party endpoints, not from a vendor claim.
