evidence:
  - url: https://api.bloomberg.com/eap/catalogs/
    status: 401
    finding: No rate-limit headers on the response; body is the JWT-missing error envelope.
  - url: https://api.bloomberg.com/
    status: 403
    finding: No rate-limit headers on the response.
  - url: https://console.blpprofessional.com/about/82
    status: 200
    finding: >-
      "Web API Connectivity Policy" is a client-side-rendered SPA route; the served HTML is a
      2.3KB shell with no policy text.
note: >-
  This file replaces a 2026-05-04 bulk-sweep scaffold that asserted free/professional tiers at
  10 and 100 requests per minute with X-RateLimit-* headers. None of that was ever published by
  Bloomberg. An honest limit_count of 0 with the probe record is the correct measurement.
