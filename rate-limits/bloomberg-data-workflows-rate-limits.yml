description: >-
  Bloomberg publishes no rate limits for the Data License REST API or the Server API on any
  anonymously reachable page, and no rate-limit headers appear on the live anonymous responses.
  Consumption on these APIs is governed contractually — by entitlement, dataset scope and
  Data License request volume in the customer's agreement — rather than by a published
  requests-per-minute ceiling. Bloomberg does maintain a "Web API Connectivity Policy", but it is
  served from the Enterprise Console (console.blpprofessional.com/about/82), a JavaScript-rendered
  application whose content is not present in the delivered HTML.
limit_count: 0
